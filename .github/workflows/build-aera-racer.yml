name: Build AERA Recovery for racer

# Builds AERA Recovery (Android 16, aera-16.0) for Motorola racer (XT2063-2)
# using a minimal repo sync + GitHub-hosted runner. Local cost: zero.
#
# How to use:
#   1. Put this whole racer-build folder in a GitHub repo (any name, e.g.
#      aera-racer-builder). The workflow and local_manifests/ must both be
#      in that repo: the workflow copies local_manifests/remove-aera-minimal.xml
#      into .repo/local_manifests/ before syncing.
#   2. Create the racer AERA device tree repo first (see BUILD_PLAN.md), then
#      run this workflow from the Actions tab with its URL.
#   3. Download the recovery.img artifact, test with `fastboot boot` (do NOT
#      flash it until it boots and touch works).
#
# Expected iterations: the minimal remove list is v1.1 and UNTESTED. The first
# runs will fail on a missing project. Read the log, delete that project's
# <remove-project> line from local_manifests/remove-aera-minimal.xml, re-run.
# 1-3 such rounds is normal for a new minimal manifest.

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: "Racer AERA device tree repo URL"
        required: true
        default: "https://github.com/<you>/android_device_motorola_racer-AERA.git"
      device_tree_branch:
        description: "Device tree branch"
        required: true
        default: "aera-16.0"
      common_tree_url:
        description: "sm7250-common tree repo URL"
        required: true
        default: "https://github.com/<you>/android_device_motorola_sm7250-common-AERA.git"
      common_tree_branch:
        description: "Common tree branch"
        required: true
        default: "aera-16.0"
      build_target:
        description: "Make target"
        required: true
        default: "recoveryimage"
  push:
    branches:
      - 'register-only'

env:
  MANIFEST_URL: https://github.com/AERA-Recovery/android_manifest.git
  MANIFEST_BRANCH: aera-16.0
  DEVICE_CODENAME: racer
  DEVICE_PATH: device/motorola/racer
  SYNC_DIR: ${{ github.workspace }}/aera

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out this builder repo
        uses: actions/checkout@v4

      - name: Free disk space (runner only has ~14 GB free by default)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Configure 24 GB swap and show free space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 openjdk-17-jdk ccache \
            build-essential bc bison flex libssl-dev libncurses-dev \
            unzip zip zlib1g-dev libxml2-utils xsltproc fontconfig \
            libgl1-mesa-dev libx11-dev lib32z1-dev libc6-dev-i386 \
            x11proto-core-dev libreadline-dev gperf liblz4-tool
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "aera-builder"
          git config --global user.email "builder@localhost"

      - name: Validate device tree URL input
        run: |
          case "${{ inputs.device_tree_url }}" in
            *"<you>"*)
              echo "::error::Set inputs.device_tree_url to the real racer AERA tree repo (see BUILD_PLAN.md)."
              exit 1
              ;;
          esac

      - name: Repo init (AERA manifest, shallow)
        run: |
          mkdir -p "$SYNC_DIR"
          cd "$SYNC_DIR"
          ~/bin/repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1

      - name: Apply minimal-sync remove list
        run: |
          mkdir -p "$SYNC_DIR/.repo/local_manifests"
          cp "${{ github.workspace }}/local_manifests/remove-aera-minimal.xml" \
             "$SYNC_DIR/.repo/local_manifests/"
          echo "Remove list: $(grep -c remove-project "$SYNC_DIR/.repo/local_manifests/remove-aera-minimal.xml") projects"

      - name: Repo sync (minimal, shallow, current branch only)
        run: |
          cd "$SYNC_DIR"
          ~/bin/repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"
          echo "--- freeing redundant prebuilts git packfiles in .repo ---"
          rm -rf "$SYNC_DIR/.repo/project-objects/platform/prebuilts" "$SYNC_DIR/.repo/projects/prebuilts"
          echo "--- synced size ---"
          du -sh "$SYNC_DIR"
          df -h

      - name: Clone racer device tree
        run: |
          cd "$SYNC_DIR"
          git clone --depth 1 -b "${{ inputs.device_tree_branch }}" \
            "${{ inputs.device_tree_url }}" "$DEVICE_PATH"
          ls "$DEVICE_PATH"

      - name: Clone sm7250-common tree
        run: |
          cd "$SYNC_DIR"
          git clone --depth 1 -b "${{ inputs.common_tree_branch }}" \
            "${{ inputs.common_tree_url }}" device/motorola/sm7250-common
          ls device/motorola/sm7250-common

      - name: Prune legacy Make definition of lib_driver_cmd_qcwcn (keep the Soong one)
        run: |
          # lib_driver_cmd_qcwcn is defined twice in hardware/qcom/wlan:
          # wcn6740/qcwcn/wpa_supplicant_8_lib/Android.bp (Soong, unconditional)
          # and legacy/qcwcn/wpa_supplicant_8_lib/Android.mk (Make). Soong runs
          # first and registers its module name into kati's module table via
          # out/soong/Android-<product>.mk, so the legacy Make definition then
          # collides ("already defined by .../wcn6740/..."). The consumers
          # (wpa_supplicant/hostapd) are Soong modules and can only resolve the
          # Soong definition, so pruning wcn6740 starved Soong instead
          # ("module wpa_supplicant missing dependencies: lib_driver_cmd_qcwcn").
          # Fix: keep the Soong definition; drop only this one legacy Make file.
          # legacy itself must stay: it is the wifi HAL conditions_default source.
          rm -f "$SYNC_DIR/hardware/qcom/wlan/legacy/qcwcn/wpa_supplicant_8_lib/Android.mk"
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-racer-aera16-${{ github.run_id }}
          restore-keys: |
            ccache-racer-aera16-

      - name: Build recoveryimage
        run: |
          cd "$SYNC_DIR"
          mkdir -p tools/tradefederation/core /tmp/ccache
          export GOGC=50
          export USE_CCACHE=1
          export CC_WRAPPER=/usr/bin/ccache
          export CCACHE_DIR=/tmp/ccache
          export CCACHE_SLOPPINESS=time_macros,include_file_mtime,file_macro
          ccache -o compression=true
          ccache -o max_size=4.0G
          ccache -z
          ccache -s
          source build/envsetup.sh
          lunch "twrp_${DEVICE_CODENAME}-bp2a-eng"
          echo "=== Diagnostic checks ==="
          echo "Checking packages/modules/common/sdk/Android.bp:"
          ls -la packages/modules/common/sdk/Android.bp
          echo "Checking prebuilts/sdk:"
          ls -ld prebuilts/sdk || echo "prebuilts/sdk not found"
          echo "=== End diagnostic checks ==="
          sudo renice -n 10 -p $$ || true
          sudo ionice -c 2 -n 7 -p $$ || true
          (
            SCANNED=0
            while true; do
              sleep 60
              if [ "$SCANNED" -eq 0 ] && [ -f out/combined-twrp_racer.ninja ]; then
                SCANNED=1
                echo "=== [DAG Check] Scanning Ninja subgraph for missing dependencies ==="
                prebuilts/build-tools/linux-x86/bin/ninja -f out/combined-twrp_racer.ninja -t commands adbd "${{ inputs.build_target }}" | grep "missing dependencies:" || echo "=== [DAG Check] 0 missing dependencies in Ninja subgraph! ==="
              fi
              echo "=== [Monitor $(date -u +%H:%M:%S)] Disk: $(df -h / | awk 'NR==2{print $3"/"$2" (avail "$4")"}') | $(free -h | awk '/^Mem:/{printf "Mem: %s/%s ", $3, $2} /^Swap:/{printf "Swap: %s/%s\n", $3, $2}') ==="
            done
          ) &
          MONITOR_PID=$!
          mka adbd "${{ inputs.build_target }}" -j"$(nproc)"
          kill $MONITOR_PID 2>/dev/null || true

      - name: Show ccache stats
        if: always()
        run: |
          export CCACHE_DIR=/tmp/ccache
          ccache -s || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-racer-aera16-${{ github.run_id }}

      - name: Show result
        run: |
          ls -lh "$SYNC_DIR/out/target/product/$DEVICE_CODENAME/"
          df -h

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: aera-racer-recovery
          path: ${{ env.SYNC_DIR }}/out/target/product/${{ env.DEVICE_CODENAME }}/recovery.img
          if-no-files-found: error
          retention-days: 14
